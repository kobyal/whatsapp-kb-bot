name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 kb/kbcheck.py
      - run: python3 -m py_compile brain/lambda_function.py
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node --check listener/listener.js && node --check listener/qrserve.js
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform init -backend=false && terraform -chdir=infra/terraform validate && terraform -chdir=infra/terraform fmt -check
      - run: pip install cfn-lint && cfn-lint infra/cloudformation/template.yaml
